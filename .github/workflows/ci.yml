name: Build and test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore StockBuddy.slnx
      - run: dotnet build StockBuddy.slnx -c Release --no-restore
      - run: dotnet test StockBuddy.slnx -c Release --no-build
      - run: dotnet publish src/StockBuddy.Web -c Release --no-build -o artifacts/app
